name: Test/Build

# Correctness on every layer, and a --quick smoke run of each so a broken benchmark fails here.
# CI timings are not results (results/SCHEMA.md: shared machines, quick runs); the quick results
# and their table are uploaded only to see that every layer ran.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # c, jvm and native (linuxX64) on Linux.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: README results match results/
        run: python3 -I scripts/table.py --readme --check
      - name: Cross-check (JVM, Linux Native)
        run: ./gradlew spotlessCheck :bench:jvmTest :bench:linuxX64Test
      - name: Smoke-run the host layers
        run: scripts/run-host.sh --quick --device "GitHub ubuntu-latest" --machine shared --out build/ci-results
      - name: Check every row
        shell: bash # pipefail: the check's exit code, not tee's
        run: python3 -I scripts/table.py --check --quick build/ci-results | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: results-linux
          path: build/ci-results

  # The android layer (Kotlin runner in a release instrumentation test) and the c layer on Android
  # (c/ built with the NDK, run over adb), on an x86_64 emulator: libschnorr256k1-kmp ships
  # arm64-v8a and x86_64.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build the instrumentation APK
        run: ./gradlew :bench-android:assembleReleaseAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke-run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            scripts/run-android.sh --quick --machine shared --out build/ci-results
            scripts/run-android-c.sh --quick --machine shared --out build/ci-results
      - name: Check every row
        shell: bash # pipefail: the check's exit code, not tee's
        run: python3 -I scripts/table.py --check --quick build/ci-results | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: results-android
          path: build/ci-results

  # c, jvm and native (macosArm64, the only layer with libschnorr256k1 through cinterop).
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Cross-check on Kotlin/Native
        run: ./gradlew -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" :bench:macosArm64Test
      - name: Smoke-run the host layers
        run: scripts/run-host.sh --quick --device "GitHub macos-latest" --machine shared --out build/ci-results
      - name: Check every row
        shell: bash # pipefail: the check's exit code, not tee's
        run: python3 -I scripts/table.py --check --quick build/ci-results | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: results-macos
          path: build/ci-results
