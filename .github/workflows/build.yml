name: Test/Build

# Correctness only, on every layer: each library's outputs against vectors/v1.txt and the
# nostr-v1 dataset's digests, and the known-issue probes. No timing: CI runners are shared
# machines, whose numbers are never results (results/SCHEMA.md), so the benchmark itself runs
# only on a dedicated machine (scripts/run-host.sh --machine dedicated).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # c, jvm and native (linuxX64) on Linux. nostr-java (about 11 ms a verify) makes :bench:jvmTest
  # about half an hour.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: README results match results/
        run: python3 -I scripts/table.py --readme --check
      - name: Check the c layer
        run: |
          cmake -S c -B build/c -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build build/c --parallel > /dev/null
          build/c/bench check --vectors vectors/v1.txt --dataset datasets/nostr-v1.bin --dataset-digests datasets/nostr-v1.txt
      - name: Check the jvm and native layers
        run: ./gradlew spotlessCheck :bench:jvmTest :bench:linuxX64Test

  # The other languages' layers on Linux, one job each.
  # python takes longest: checking BIP-340's reference.py (about 75 ms a verify) against every
  # digest is most of an hour on four cores.
  layers:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        layer: [rust, go, node, bun, python]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - if: matrix.layer == 'go'
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
      - if: matrix.layer == 'node' || matrix.layer == 'bun'
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - if: matrix.layer == 'bun'
        uses: oven-sh/setup-bun@v2
      - if: matrix.layer == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check the ${{ matrix.layer }} layer
        run: |
          case "${{ matrix.layer }}" in
            node|bun) js/run.sh --runtime "${{ matrix.layer }}" --check ;;
            *) "${{ matrix.layer }}/run.sh" --check ;;
          esac

  # The android layer (AndroidCrossCheckTest) and the c layer on Android (c/ built with the NDK,
  # run over adb), on an x86_64 emulator: libschnorr256k1-kmp ships arm64-v8a and x86_64.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build the instrumentation APK
        run: ./gradlew :bench-android:assembleReleaseAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            scripts/run-android.sh --check
            scripts/run-android-c.sh --check

  # c, jvm and native on macOS arm64: the only place libschnorr256k1 runs through cinterop, and
  # the jvm layer's libraries on their macOS arm64 native builds.
  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Check the c layer
        run: |
          cmake -S c -B build/c -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build build/c --parallel > /dev/null
          build/c/bench check --vectors vectors/v1.txt --dataset datasets/nostr-v1.bin --dataset-digests datasets/nostr-v1.txt
      - name: Check the jvm and native layers
        run: ./gradlew -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" :bench:jvmTest :bench:macosArm64Test
