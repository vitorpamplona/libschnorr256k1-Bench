[versions]
agp = "9.5.0"
android-compileSdk = "37"
android-minSdk = "26"
androidxBenchmark = "1.5.0"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
bitcoinS = "1.9.12"
bouncycastle = "1.86"
cryptoKmp = "2.1.0"
kotlin = "2.4.21"
nostrJava = "2.4.2"
# JitPack builds of libschnorr256k1-kmp's main, by commit (settings.gradle.kts); 1.1.0 is that commit's code.
schnorr256k1Kmp = "f19cabc890"
secp256k1Kmp = "0.24.0"
spotless = "8.10.4"

[libraries]
androidx-benchmark-junit4 = { module = "androidx.benchmark:benchmark-junit4", version.ref = "androidxBenchmark" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
crypto = { module = "com.vitorpamplona.crypto:crypto", version.ref = "cryptoKmp" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
# The implementations under test
schnorr256k1-kmp = { group = "com.github.vitorpamplona.libschnorr256k1-kmp", name = "schnorr256k1-kmp", version.ref = "schnorr256k1Kmp" }
# Built from third_party/libschnorr256k1-kotlin (settings.gradle.kts) until it is published.
schnorr256k1-kotlin = { group = "com.vitorpamplona.schnorr256k1", name = "schnorr256k1-kotlin", version = "0.1.0" }
secp256k1-kmp = { group = "fr.acinq.secp256k1", name = "secp256k1-kmp", version.ref = "secp256k1Kmp" }
secp256k1-kmp-jni-android = { group = "fr.acinq.secp256k1", name = "secp256k1-kmp-jni-android", version.ref = "secp256k1Kmp" }
secp256k1-kmp-jni-jvm = { group = "fr.acinq.secp256k1", name = "secp256k1-kmp-jni-jvm", version.ref = "secp256k1Kmp" }
# JVM-only implementations (bench/README-jvm-libraries.md)
bitcoin-s-crypto = { group = "org.bitcoin-s", name = "bitcoin-s-crypto_2.13", version.ref = "bitcoinS" }
bouncycastle-bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
nostr-java-core = { group = "xyz.tcheeric", name = "nostr-java-core", version.ref = "nostrJava" }

[plugins]
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidxBenchmark = { id = "androidx.benchmark", version.ref = "androidxBenchmark" }
diffplugSpotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
