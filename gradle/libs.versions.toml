[versions]
kotlin = "2.4.21"
kotlinxBenchmark = "0.5.0"
schnorr256k1Kmp = "1.0.5"
secp256k1Kmp = "0.24.0"
spotless = "8.10.4"

[libraries]
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
kotlinx-benchmark-runtime = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "kotlinxBenchmark" }
# The implementations under test
schnorr256k1-kmp = { group = "com.vitorpamplona.schnorr256k1", name = "schnorr256k1-kmp", version.ref = "schnorr256k1Kmp" }
# Built from the libschnorr256k1-kotlin submodule (settings.gradle.kts) until it is published.
schnorr256k1-kotlin = { group = "com.vitorpamplona.schnorr256k1", name = "schnorr256k1-kotlin", version = "0.1.0" }
secp256k1-kmp = { group = "fr.acinq.secp256k1", name = "secp256k1-kmp", version.ref = "secp256k1Kmp" }
secp256k1-kmp-jni-jvm = { group = "fr.acinq.secp256k1", name = "secp256k1-kmp-jni-jvm", version.ref = "secp256k1Kmp" }

[plugins]
diffplugSpotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinx-benchmark = { id = "org.jetbrains.kotlinx.benchmark", version.ref = "kotlinxBenchmark" }
